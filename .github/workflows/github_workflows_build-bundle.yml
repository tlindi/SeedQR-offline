# Updated build-bundle workflow: only upload/commit when bundle exists.
name: Build single HTML bundle

on:
  workflow_dispatch:
  push:
    branches:
      - bundle-single-html

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ensure we can push back if needed
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run bundler
        id: run_bundler
        run: |
          set -e
          python3 scripts/build_bundle_html.py -i SeedQR.html -o dists/SeedQR.bundle.html

      - name: Check bundle exists
        id: check_bundle
        run: |
          if [ -f "dists/SeedQR.bundle.html" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload bundle artifact
        if: steps.check_bundle.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SeedQR-bundle
          path: dists/SeedQR.bundle.html

      # Optional: commit the bundled file back to the branch using git (avoids Node-based action)
      - name: Commit bundled file back to branch (optional)
        if: steps.check_bundle.outputs.exists == 'true'
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dists/SeedQR.bundle.html
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add bundled SeedQR HTML (generated)"
            git push
          fi