name: Build Bundle (Legacy ES5 Validation) 

on:
  workflow_dispatch:
  push:
    branches:
      - FIX-legacysupport
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'libs/**'
      - 'scripts/build_bundle_html-legacysupport.py'
      - '.github/workflows/build-bundle-branch-legacysupport.yml'
  pull_request:
    branches:
      - FIX-legacysupport

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Validate Bundle (ES5)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install Babel
        run: npm install --save-dev @babel/core @babel/cli @babel/preset-env

      - name: Create Babel config
        run: |
          echo '{
            "presets": [
              ["@babel/preset-env", {
                "targets": {
                  "chrome": "49",
                  "firefox": "44"
                }
              }]
            ]
          }' > .babelrc

      - name: Transpile JS sources to ES5
        run: |
          npx babel js --out-dir js-legacy
          npx babel libs --out-dir libs-legacy

      - name: Validate & Build Bundle (strict ES5 mode)
        run: |
          python3 scripts/build_bundle_html-legacysupport.py \
            --input index.html \
            --output SeedQR-legacy.html \
            --strict
        continue-on-error: false

      - name: Verify bundle file was created
        run: |
          if [ ! -f SeedQR-legacy.html ]; then
            echo "ERROR: SeedQR-legacy.html not generated"
            exit 1
          fi
          ls -lh SeedQR-legacy.html
          echo "✓ Bundle created successfully"

      - name: Check for ES6 syntax patterns
        run: |
          echo "Scanning for ES6 patterns in bundled file..."
          patterns=("const " "let " "class " " => " "\`" "async " "await ")
          found=0
          for pattern in "${patterns[@]}"; do
            if grep -q "$pattern" SeedQR-legacy.html; then
              echo "⚠️  Found pattern: $pattern"
              found=$((found + 1))
            fi
          done
          if [ $found -gt 0 ]; then
            echo "⚠️  Warning: $found ES6 patterns detected in bundle"
          else
            echo "✓ No common ES6 patterns detected"
          fi

      - name: Commit and push if bundle changed
        run: |
          git add SeedQR-legacy.html js-legacy libs-legacy
          if git diff --cached --quiet; then
            echo "No changes to legacy build"
          else
            git commit -m "Add bundled SeedQR HTML (generated legacy)"
            git reset --hard
            git pull origin ${{ github.ref_name }} --rebase || git rebase --abort
            git push origin ${{ github.ref_name }}
          fi

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v7
        with:
          name: SeedQR-bundle-legacysupport
          path: SeedQR-legacy.html
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const bundleSize = fs.statSync('SeedQR-legacy.html').size / 1024;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✓ **Build successful (legacysupport branch)!**\n\n📦 Bundle: \`SeedQR-legacy.html\` (${bundleSize.toFixed(2)} KB)\n\n✓ ES5 validation passed\n\nRun locally: \`python3 scripts/build_bundle_html-legacysupport.py --strict\``
            })

      - name: Create Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: SeedQR-legacy.html
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
