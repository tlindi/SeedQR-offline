name: Deploy Pages (SeedQR-offline)

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    build-deploy:
      runs-on: ubuntu-latest
    steps:
      - name: Checkout
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      // - name: Lint (ES5 validation)
      //  run: npx eslint . --max-warnings 0

      // - name: Build
      //  run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (SeedQR-offline)
        id: deployment
        uses: actions/deploy-pages@v5
