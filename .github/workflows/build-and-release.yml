name: Build and publish bundle (artifact + GitHub Release)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create GitHub Release and upload bundle'
        required: false
        default: 'false'
      release_tag:
        description: 'Release tag to create (optional). If blank and run by tag push, the pushed tag will be used.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      bundle_exists: ${{ steps.check_bundle.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run bundler
        id: run_bundler
        run: |
          set -e
          python3 scripts/build_bundle_html.py -i SeedQR.html -o dists/SeedQR.bundle.html

      - name: Check bundle exists
        id: check_bundle
        run: |
          if [ -f "dists/SeedQR.bundle.html" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload bundle artifact
        if: steps.check_bundle.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SeedQR-bundle
          path: dists/SeedQR.bundle.html

      - name: Commit bundled file back to branch (optional)
        if: steps.check_bundle.outputs.exists == 'true'
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dists/SeedQR.bundle.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add bundled SeedQR HTML (generated)"
            git push
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.bundle_exists == 'true' && (github.event_name == 'push' || github.event.inputs.publish_release == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: get_tag
        run: |
          # If triggered by a tag push, use that tag; otherwise use provided input or build a timestamp tag.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            ts=$(date -u +%Y%m%d%H%M%S)
            echo "tag=bundle-${ts}" >> $GITHUB_OUTPUT
          fi

      - name: Create Git tag (if not already present)
        id: create_tag
        run: |
          TAG=${{ steps.get_tag.outputs.tag }}
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          release_name: ${{ steps.get_tag.outputs.tag }}
          body: "Automated bundle created by workflow."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundle to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dists/SeedQR.bundle.html
          asset_name: SeedQR.bundle.html
          asset_content_type: text/html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}